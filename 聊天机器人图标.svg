  <rect x="100" y="320" width="60" height="180" rx="20" fill="#ffffff"/>
  <rect x="120" y="340" width="30" height="140" rx="15" fill="#1989fa"/>
  <rect x="800" y="320" width="60" height="180" rx="20" fill="#ffffff"/>
  <rect x="810" y="340" width="30" height="140" rx="15" fill="#1989fa"/>
