  <!-- 天线底座 -->
  <rect x="130" y="180" width="18" height="160" rx="9" fill="#1989fa"/>
  <circle cx="139" cy="180" r="32" fill="#1989fa"/>
  <rect x="812" y="180" width="18" height="160" rx="9" fill="#1989fa"/>
  <circle cx="821" cy="180" r="32" fill="#1989fa"/>
