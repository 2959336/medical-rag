  <path d="M340 400 Q380 360 420 400" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M540 400 Q580 360 620 400" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- 微笑嘴巴 -->
  <path d="M430 470 Q480 510 530 470" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- 脖子 -->
  <rect x="380" y="560" width="200" height="40" rx="10" fill="#1989fa"/>
  <!-- 身体躯干 -->
  <path d="M220 600 Q480 560 740 600 L720 740 Q480 790 240 740 Z" fill="#ffffff" stroke="#b3d9fa" stroke-width="3"/>
